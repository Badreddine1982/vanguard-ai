  statement: >
    The current knowledge architecture may not yet be the correct layer
    for deciding pruning, deletion, or retention rights. The governing
    persistence law therefore preserves evidence while deferring those
    architectural rights to a later review.
  observed:
    principle: "Probability may enter the loop, but it does not leave the loop as truth without confirmation."
    failure_handling: "A failed experiment is retained as evidence and may enter the potential-error record."
  evidence:
    current_validation: pending
    independent_reproduction: pending
    architectural_review: pending
  disposition:
    retain: true
    adopt_as_fact: false
    prune_decision: deferred
